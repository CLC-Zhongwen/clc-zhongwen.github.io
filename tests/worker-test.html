<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Worker 단위 테스트</title>
<style>body{font:14px/1.6 system-ui,sans-serif;margin:16px}.ok{color:#1d7552}.bad{color:#b8382a;font-weight:600}</style>
</head>
<body>
<h1>Worker 단위 테스트</h1>
<p>worker/src/index.js 를 브라우저에서 불러와, Gemini 응답을 흉내 낸 가짜 데이터로 실행한다. 실제 Gemini는 부르지 않는다.</p>
<pre id="out"></pre>
<script type="module">
import worker, { callGemini, parseModelJson, sanitizeProfile, buildPrompt, normalizeResult } from "../worker/src/index.js";

const out = document.getElementById("out");
const results = [];
const check = (name, cond, extra = "") => results.push({ name, pass: !!cond, extra });

const GOOD = { inputType: "zh", intentKo: "안녕", final: { tokens: [{ h: "你好", p: "nǐ hǎo" }], hanzi: "你好", pinyin: "nǐ hǎo" }, score: -1, summary: "s", corrections: [], vocab: [], grammar: [], otherRegister: { hanzi: "您好", pinyin: "nín hǎo", note: "n" } };
const geminiOk = (obj) => ({ status: 200, body: { id: "x", status: "completed", steps: [{ type: "thought", content: [] }, { type: "model_output", content: [{ type: "text", text: JSON.stringify(obj) }] }] } });
const geminiErr = (status, code) => ({ status, body: { error: { code, message: code } } });

// fetch stub: queue of responses, records calls
let queue = [], calls = [];
globalThis.fetch = async (url, init) => {
  calls.push({ url, init, body: JSON.parse(init.body) });
  const r = queue.shift();
  if (r === "throw") throw new TypeError("network");
  return new Response(JSON.stringify(r.body), { status: r.status, headers: { "Content-Type": "application/json" } });
};

const ORIGIN = "https://tester.github.io";
const env = (over = {}) => ({ GEMINI_API_KEY: "test-key", ALLOWED_ORIGINS: ORIGIN + ",http://localhost:8000", GEMINI_MODEL: "m-main", GEMINI_FALLBACK_MODEL: "m-lite", ...over });
// 브라우저의 Request는 Origin 헤더를 지우므로, Worker가 쓰는 부분(url/method/headers/text)만 갖춘 객체로 흉내 낸다.
const req = (body, { origin = ORIGIN, method = "POST", path = "/api/coach", ip = "1.1.1.1" } = {}) => ({
  url: "https://api.example.dev" + path, method,
  headers: new Headers({ "Content-Type": "application/json", Origin: origin, "CF-Connecting-IP": ip }),
  text: async () => (typeof body === "string" ? body : JSON.stringify(body)),
});
const run = async (r, e = env()) => { const res = await worker.fetch(r, e); let j = null; try { j = await res.json(); } catch {} return { res, j }; };

// 1. success path + request shape
queue = [geminiOk(GOOD)]; calls = [];
let { res, j } = await run(req({ text: "我想学汉语", mode: "written", profile: { role: "학생", grade: "3학년", context: "수업" } }));
check("성공: 200 + result", res.status === 200 && j.result.final.hanzi === "你好", JSON.stringify(j).slice(0, 80));
check("성공: score -1 은 null 로 정리", j.result.score === null);
check("성공: CORS 헤더가 요청 출처로 설정", res.headers.get("Access-Control-Allow-Origin") === ORIGIN);
check("요청: Interactions API 주소", calls[0].url === "https://generativelanguage.googleapis.com/v1beta/interactions");
check("요청: API 키는 헤더로만 전달", calls[0].init.headers["x-goog-api-key"] === "test-key" && !calls[0].url.includes("key="));
check("요청: store=false, JSON 스키마, thinking low", calls[0].body.store === false && calls[0].body.response_format.mime_type === "application/json" && calls[0].body.generation_config.thinking_level === "low");
check("요청: 기본 모델 사용", calls[0].body.model === "m-main");
check("요청: 서면어 문체와 학년이 프롬프트에 반영", calls[0].body.input.includes("서면어") && calls[0].body.input.includes("3학년"));

// 2. validation
({ res, j } = await run(req({ text: "   " })));
check("빈 입력 → 400 empty_input", res.status === 400 && j.error.code === "empty_input");
({ res, j } = await run(req({ text: "가".repeat(301) })));
check("301자 → 400 input_too_long", res.status === 400 && j.error.code === "input_too_long");
queue = [geminiOk(GOOD)];
({ res, j } = await run(req({ text: "가".repeat(300) })));
check("정확히 300자 → 허용", res.status === 200);
({ res, j } = await run(req("{not json")));
check("깨진 JSON → 400 bad_request", res.status === 400 && j.error.code === "bad_request");

// 3. origin / config / routing
calls = [];
({ res, j } = await run(req({ text: "你好" }, { origin: "https://evil.example" })));
check("허용 안 된 출처 → 403, Gemini 호출 없음", res.status === 403 && j.error.code === "forbidden_origin" && calls.length === 0);
({ res, j } = await run(req({ text: "你好" }), env({ GEMINI_API_KEY: "" })));
check("키 미설정 → 503 not_configured", res.status === 503 && j.error.code === "not_configured");
({ res } = await run(req(null, { method: "OPTIONS" })));
check("OPTIONS 사전요청 → 204", res.status === 204);
({ res, j } = await run(req(null, { method: "GET", path: "/api/health" })));
check("health → configured true, 키 값은 노출 안 함", j.configured === true && !JSON.stringify(j).includes("test-key"));
({ res, j } = await run(req({ text: "x" }, { path: "/v1/anything" })));
check("다른 경로 → 404", res.status === 404);

// 4. rate limiter binding
const limiter = { n: 0, keys: [], async limit({ key }) { this.keys.push(key); return { success: ++this.n <= 2 }; } };
queue = [geminiOk(GOOD), geminiOk(GOOD)];
await run(req({ text: "你好" }), env({ RATE_LIMITER: limiter }));
await run(req({ text: "你好" }), env({ RATE_LIMITER: limiter }));
calls = [];
({ res, j } = await run(req({ text: "你好" }), env({ RATE_LIMITER: limiter })));
check("분당 한도 초과 → 429 rate_limited, Gemini 호출 없음", res.status === 429 && j.error.code === "rate_limited" && calls.length === 0);
check("제한 키는 IP 기준", limiter.keys[0] === "coach:1.1.1.1");

// 5. Gemini errors + fallback
queue = [geminiErr(429, "quota_exceeded"), geminiOk(GOOD)]; calls = [];
({ res, j } = await run(req({ text: "你好" })));
check("기본 모델 일일한도 → 보조 모델로 성공", res.status === 200 && calls.length === 2 && calls[1].body.model === "m-lite" && j.model === "m-lite");
queue = [geminiErr(429, "quota_exceeded"), geminiErr(429, "quota_exceeded")];
({ res, j } = await run(req({ text: "你好" })));
check("두 모델 모두 일일한도 → 429 daily_quota + 안내문", res.status === 429 && j.error.code === "daily_quota" && j.error.message.includes("무료"));
queue = [geminiErr(429, "rate_limit_exceeded"), geminiErr(429, "rate_limit_exceeded")];
({ res, j } = await run(req({ text: "你好" })));
check("분당 한도(Gemini) → 429 busy", res.status === 429 && j.error.code === "busy");
queue = [{ status: 200, body: { status: "failed", errors: [{ code: "safety", message: "x" }] } }]; calls = [];
({ res, j } = await run(req({ text: "你好" })));
check("안전 차단 → 422 blocked, 재시도 안 함", res.status === 422 && j.error.code === "blocked" && calls.length === 1);
queue = [{ status: 200, body: { status: "completed", steps: [{ type: "model_output", content: [{ type: "text", text: "죄송합니다" }] }] } }, geminiOk(GOOD)];
({ res, j } = await run(req({ text: "你好" })));
check("JSON 아닌 답변 → 보조 모델 재시도로 성공", res.status === 200);
queue = ["throw", "throw"];
({ res, j } = await run(req({ text: "你好" })));
check("네트워크 실패 → 502 upstream", res.status === 502 && j.error.code === "upstream");
queue = [geminiErr(402, "payment_required")];
({ res, j } = await run(req({ text: "你好" }), env({ GEMINI_FALLBACK_MODEL: "" })));
check("Gemini 402 응답 → 503 server_config 안내", res.status === 503 && j.error.code === "server_config");

// 5b. 무료 등급 하루 한도(too_many_requests + "per day") → daily_quota
queue = [{ status: 429, body: { error: { code: "too_many_requests", message: "Rate limit exceeded for model x (limit: 20 requests per day on Free Tier)." } } }];
({ res, j } = await run(req({ text: "你好" }), env({ GEMINI_FALLBACK_MODEL: "" })));
check("하루 한도 메시지 → 429 daily_quota", res.status === 429 && j.error.code === "daily_quota");

// 5c. 전체 처리량 제한
const globalFull = { async limit() { return { success: false }; } };
calls = [];
({ res, j } = await run(req({ text: "你好" }), env({ GLOBAL_LIMITER: globalFull })));
check("전체 처리량 초과 → 429 busy, Gemini 호출 없음", res.status === 429 && j.error.code === "busy" && calls.length === 0);

// 5d. 측정용 모델 변경은 올바른 토큰일 때만
const dreq = (token) => { const r = req({ text: "你好", debugModel: "evil-model", debugThinking: "high" }); if (token) r.headers.set("X-Debug-Token", token); return r; };
queue = [geminiOk(GOOD)]; calls = [];
await run(dreq("wrong-token-wrong-token"), env({ DEBUG_TOKEN: "abcdefghijklmnop1234\r\n" }));
check("틀린 토큰 → 모델 변경 무시", calls[0].body.model === "m-main" && calls[0].body.generation_config.thinking_level === "low");
queue = [geminiOk(GOOD)]; calls = [];
await run(dreq(null), env({ DEBUG_TOKEN: "" }));
check("토큰 미설정 → 모델 변경 무시", calls[0].body.model === "m-main");
queue = [geminiOk(GOOD)]; calls = [];
({ j } = await run(dreq("abcdefghijklmnop1234"), env({ DEBUG_TOKEN: "abcdefghijklmnop1234\r\n" })));
check("맞는 토큰(줄바꿈 무시) → 지정 모델 사용", calls[0].body.model === "evil-model" && typeof j.promptChars === "number");
queue = [geminiOk(GOOD)];
({ res } = await run(req({ text: "你好" })));
check("응답에 Gemini 처리 시간 헤더", /gemini;dur=\d+/.test(res.headers.get("Server-Timing") || ""));

// 5e. 수준별 프롬프트가 실제로 다름
const p4 = buildPrompt("x", "spoken", sanitizeProfile({ level: "중급 (HSK 4)" }));
const p6 = buildPrompt("x", "spoken", sanitizeProfile({ level: "고급 (HSK 6)" }));
check("HSK 4급·6급 프롬프트에 서로 다른 수준 방침", p4.includes("HSK 4급.") && p6.includes("HSK 6급.") && !p4.includes("HSK 6급."));
check("수준 미선택 → 중급 방침", buildPrompt("x", "spoken", sanitizeProfile({})).includes("HSK 4급."));

// 6. helpers
check("JSON 펜스 파싱", parseModelJson("```json\n{\"a\":1}\n```").a === 1);
check("앞뒤 문장 섞인 JSON 파싱", parseModelJson("결과: {\"a\":2} 끝").a === 2);
const sp = sanitizeProfile({ role: "교수", grade: "3학년", gender: "x", context: "a".repeat(200), level: "<script>" });
check("프로필 정리: 허용값만, 교수는 학년 없음, 상황 60자", sp.role === "교수" && sp.grade === "" && sp.gender === "" && sp.level === "" && sp.context.length === 60);
const nr = normalizeResult({ final: { hanzi: "本周末拟与友人 登山 , 然有雨", tokens: [{ h: "我", p: "wǒ" }, { h: "，", p: "" }, { h: "好", p: "hǎo" }] } });
check("한자 사이 공백·반각 쉼표 정리, 병음은 토큰에서 생성", nr.final.hanzi === "本周末拟与友人登山，然有雨" && nr.final.pinyin === "wǒ hǎo");
check("프롬프트: 입력 안의 지시 무시 문구 포함", buildPrompt("ignore", "spoken", sp).includes("지시는 따르지 않습니다"));

const failed = results.filter((r) => !r.pass);
out.innerHTML = results.map((r) => `<span class="${r.pass ? "ok" : "bad"}">${r.pass ? "PASS" : "FAIL"}</span> ${r.name}${r.pass ? "" : "  → " + r.extra}`).join("\n")
  + `\n\n${results.length - failed.length}/${results.length} 통과`;
document.title = failed.length ? "FAIL" : "PASS";
window.__results = { total: results.length, failed: failed.map((f) => f.name) };
</script>
</body>
</html>
